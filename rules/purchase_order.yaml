# 訂購單合約專用規則
doc_type: purchase_order
rules:
  - id: po-price
    name: 價金／總價
    type: required
    severity: error
    patterns: ["總價", "價金", "契約金額", "合約金額", "訂購金額", "總金額"]
    message: 全文未發現價金／總價條款，訂購單合約應載明金額。

  - id: po-payment
    name: 付款條件
    type: required
    severity: error
    patterns: ["付款條件", "付款方式", "付款辦法", "給付價金"]
    message: 全文未發現付款條件條款，請確認是否遺漏。

  - id: po-delivery
    name: 交貨期限
    type: required
    severity: error
    patterns: ["交貨", "交期", "交付期限", "到貨"]
    message: 全文未發現交貨期限相關條款，請確認是否遺漏。

  - id: po-acceptance
    name: 驗收
    type: required
    severity: warning
    patterns: ["驗收", "檢驗"]
    message: 全文未發現驗收／檢驗條款，請確認是否遺漏。

  - id: po-penalty
    name: 違約金／逾期罰則
    type: required
    severity: warning
    patterns: ["違約金", "逾期罰款", "罰則", "懲罰性", "約定損失賠償", "[Ll]iquidated [Dd]amages?"]
    message: 全文未發現違約金／約定損失賠償（LD）條款，請確認是否遺漏。

  - id: po-warranty
    name: 保固
    type: required
    severity: warning
    patterns: ["保固", "瑕疵擔保"]
    message: 全文未發現保固／瑕疵擔保條款，請確認是否遺漏。

  # ── 以下依中鼎式訂購單注意事項新增 ──
  - id: po-incoterm
    name: 貿易條件（Incoterms）
    type: required
    severity: info
    patterns: ["Incoterms?", "FOB", "CIF", "CFR", "EXW", "DDP", "DAP", "FCA", "CPT", "CIP", "DPU", "FAS", "貿易條件"]
    message: 全文未發現 Incoterms 貿易條件（FOB／CIF／DDP…），涉及交貨責任與風險移轉，請確認是否遺漏。

  - id: po-insurance
    name: 保險條款
    type: required
    severity: info
    patterns: ["保險", "投保"]
    message: 全文未發現保險條款（注意事項：保險條款不可刪除，航運保險應延伸至工地），請確認。

  - id: po-covid19
    name: COVID-19 條款
    type: required
    severity: info
    patterns: ["COVID-19", "COVID", "新冠", "疫情"]
    message: 全文未發現 COVID-19／疫情條款（注意事項：訂購單應有 COVID-19 條款），請確認是否遺漏。

  # ── 2026-10 由 contract-reviewer（Python 原型）章節完整性檢查轉入，對準中鼎 PO(C) A～N 條款 ──
  # 既有規則已涵蓋：B 付款(po-payment)、C 交貨(po-delivery/po-incoterm)、D 保固(po-warranty)、
  # E 約定損失賠償(po-penalty)、G 準據法(common-dispute)、H 檢驗(po-acceptance)、K 保險(po-insurance)、N COVID-19(po-covid19)
  - id: po-documents
    name: 訂購文件（A 條）
    type: required
    severity: info
    patterns: ["訂購文件", "契約文件", "合約文件", "附件[一二三四五六七八九十\\d]"]
    message: 全文未發現訂購文件／附件清單（A 條），附件序號不得任意更動，無附件者應加註「（無）」，請確認。

  - id: po-packing
    name: 包裝運送（F 條）
    type: required
    severity: info
    patterns: ["包裝", "嘜頭", "裝運", "[Pp]acking", "[Mm]arking"]
    message: 全文未發現包裝／運送條款（F 條），請確認是否遺漏。

  - id: po-expediting
    name: 催貨檢驗（H 條）
    type: required
    severity: info
    patterns: ["催貨", "[Ee]xpedit", "遠端視訊", "視訊檢驗"]
    message: 全文未發現催貨（H 條）相關文字；注意事項：遠端視訊催貨／檢驗條款不得刪除，請確認。

  - id: po-cancellation
    name: 取消費（J 條）
    type: required
    severity: info
    patterns: ["取消費", "取消訂單", "取消訂購", "[Cc]ancellation"]
    message: 全文未發現取消費／取消訂購條款（J 條），請確認是否遺漏。
